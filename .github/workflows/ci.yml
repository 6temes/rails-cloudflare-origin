name: ci

# Bare `push`: a pull_request trigger stops running entirely once GitHub marks
# a PR CONFLICTING, and carrying both would double-run every PR.
# `branches: ['**']` rather than a filterless `push`: that also fires on tag
# pushes, and release tags have their own workflow. `tags-ignore` is NOT the
# alternative -- with no branch filter present GitHub runs the workflow on no
# branch push at all.
on:
  push:
    branches: ['**']

# Guarded rather than a plain `true`: a default-branch run is the one that
# establishes whether main is green.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # The branch ruleset requires a check named `test`; renaming the job blocks
  # every merge.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          # From .ruby-version rather than a second copy of the value here.
          # Dependabot bumps `uses:` refs and never input values, so a literal
          # is the one pin nothing ever moves.
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Lint
        run: bundle exec standardrb
      - name: Tests
        run: bundle exec rake test
