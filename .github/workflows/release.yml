name: release

# Publishes through RubyGems trusted publishing, so no API key is stored in
# this repository. The `release` environment admits only `v*` tags.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # CI skips tag pushes, so this is the only run of lint and tests on the
  # tagged commit. It holds no id-token, so a compromised development gem
  # cannot mint a publishing token.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Lint
        run: bundle exec standardrb
      - name: Tests
        run: bundle exec rake test

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      # Exchanged for a short-lived RubyGems token.
      id-token: write
      # Read only: the triggering tag already exists, so `rake release` never
      # pushes one from here.
      contents: read
    env:
      # Installs only the runtime dependencies `rake release` needs, so no
      # development gem runs in the job that can publish.
      BUNDLE_WITHOUT: development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1
